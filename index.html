<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Benar/Salah — Simpan ke Google Sheet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            padding: 35px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        h1 { color: #2c3e50; margin-bottom: 25px; font-size: 1.8rem; text-align: center; }
        h2 { font-size: 1.2rem; color: #34495e; margin: 20px 0 10px; }
        
        .buat-tim-baris { display: flex; gap: 10px; margin-bottom: 20px; }
        .buat-tim-baris input {
            flex: 1; padding: 12px 15px; font-size: 1rem;
            border: 2px solid #ddd; border-radius: 10px; outline: none;
        }
        .buat-tim-baris input:focus { border-color: #4facfe; }
        .btn-buat-tim {
            padding: 12px 20px; background: #3498db; color: white;
            border: none; border-radius: 10px; cursor: pointer; font-weight: bold;
        }
        .btn-buat-tim:hover { background: #2980b9; }
        
        .daftar-tim { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .tim-kartu {
            background: linear-gradient(135deg, #e3f2fd, #f0f9ff);
            padding: 18px 22px; border-radius: 16px;
            border-left: 5px solid #3498db;
        }
        .tim-kartu.terbuka {
            border-color: #2ecc71; box-shadow: 0 0 0 3px rgba(46,204,113,0.3);
        }
        .tim-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .tim-nama { font-weight: bold; font-size: 1.2rem; color: #2c3e50; }
        .tim-meta { font-size: 0.9rem; color: #666; margin-top: 4px; }
        .poin-anggota {
            font-size: 0.85rem; color: #555; margin-top: 4px;
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .poin-siswa {
            background: #f0f0f0; padding: 3px 8px; border-radius: 12px;
        }
        .poin-siswa.benar { background: #d4edda; color: #155724; font-weight: bold; }
        .tim-aksi button {
            padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
        }
        .btn-tambah-buka { background: #2ecc71; color: white; margin-right: 5px; }
        .btn-hapus-tim { background: #e74c3c; color: white; }
        
        .area-tambah-anggota { margin-top: 15px; display: none; }
        .tim-kartu.terbuka .area-tambah-anggota { display: block; }
        
        .kotak-cari { position: relative; margin-bottom: 10px; }
        .kotak-cari input {
            width: 100%; padding: 11px 14px; border: 2px solid #ddd;
            border-radius: 8px; outline: none; font-size: 1rem;
        }
        .kotak-cari input:focus { border-color: #4facfe; }
        .daftar-saran {
            position: absolute; left: 0; right: 0; top: 100%;
            background: white; border: 2px solid #4facfe; border-top: none;
            border-radius: 0 0 10px 10px; max-height: 200px; overflow-y: auto;
            z-index: 200; display: none; box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        .item-saran {
            padding: 11px 15px; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: background 0.15s;
        }
        .item-saran:hover { background: #e3f2fd; }
        .item-saran.sudah-ada { color: #999; cursor: not-allowed; }
        
        .daftar-anggota { margin-top: 10px; }
        .item-anggota {
            display: flex; justify-content: space-between; align-items: center;
            padding: 9px 14px; background: white; border-radius: 8px; margin-bottom: 6px;
        }
        .btn-hapus-anggota {
            background: none; border: none; color: #e74c3c;
            cursor: pointer; font-size: 1.1rem; padding: 0 6px;
        }
        
        .btn-mulai {
            width: 100%; padding: 16px; font-size: 1.2rem; font-weight: bold;
            background: #2ecc71; color: white; border: none; border-radius: 14px;
            cursor: pointer; transition: all 0.2s; margin-top: 10px;
        }
        .btn-mulai:hover { transform: scale(1.02); background: #27ae60; }
        .btn-mulai:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; }
        
        .layar { display: none; }
        .layar.aktif { display: block; }
        
        .progress { text-align: center; color: #7f8c8d; margin-bottom: 15px; font-size: 1.1rem; }
        .soal-box {
            background: #f8f9fa; padding: 30px; border-radius: 18px;
            margin-bottom: 25px; border-left: 6px solid #4facfe;
            font-size: 1.4rem; line-height: 1.7; color: #2c3e50; text-align: center;
        }
        
        .daftar-pilihan-tim { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .pilihan-tim-kartu {
            padding: 15px 20px; border: 3px solid #ddd; border-radius: 12px;
            transition: all 0.2s; background: #fafafa;
        }
        .pilihan-tim-kartu.sudah-pilih { border-color: #3498db; background: #eaf4fe; }
        .pilihan-tim-kartu.terperiksa.benar { border-color: #2ecc71; background: #d4edda; }
        .pilihan-tim-kartu.terperiksa.salah { border-color: #e74c3c; background: #fde8e8; }
        .baris-pilihan { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .nama-tim-pilih { font-weight: bold; font-size: 1.1rem; }
        .tombol-pilih { display: flex; gap: 8px; }
        .btn-pilih-jwb {
            padding: 8px 16px; border: 2px solid transparent; border-radius: 8px;
            cursor: pointer; font-weight: bold; transition: all 0.2s;
        }
        .btn-pilih-jwb.benar { background: #2ecc71; color: white; }
        .btn-pilih-jwb.salah { background: #e74c3c; color: white; }
        .btn-pilih-jwb.dipilih { border-color: #2c3e50; box-shadow: inset 0 0 0 2px white; }
        .btn-pilih-jwb:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-periksa {
            width: 100%; padding: 18px; font-size: 1.2rem; font-weight: bold;
            background: #f39c12; color: white; border: none; border-radius: 14px;
            cursor: pointer; transition: all 0.2s; margin-bottom: 20px;
        }
        .btn-periksa:hover { transform: scale(1.02); background: #e67e22; }
        .btn-periksa:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; }
        
        .kotak-umpan {
            padding: 18px; border-radius: 12px; margin-bottom: 20px; display: none;
            line-height: 1.6; font-size: 1.05rem;
        }
        .kotak-umpan.benar { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .kotak-umpan.salah { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .btn-lanjut {
            display: block; margin: 0 auto; padding: 14px 30px;
            background: #3498db; color: white; border: none; border-radius: 12px;
            font-size: 1.1rem; cursor: pointer; display: none;
        }
        
        .peringkat { margin: 30px 0; }
        .item-peringkat {
            padding: 18px 22px; margin-bottom: 12px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 8px; font-size: 1.05rem;
        }
        .baris-atas { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; }
        .p1 { background: #fff3cd; border-left: 5px solid #f1c40f; }
        .p2 { background: #e9e9e9; border-left: 5px solid #95a5a6; }
        .p3 { background: #f5e6d3; border-left: 5px solid #cd7f32; }
        .status-simpan { text-align: center; margin: 15px 0; font-weight: bold; padding: 10px; border-radius: 10px; }
        .status-simpan.berhasil { background: #d4edda; color: #155724; }
        .status-simpan.gagal { background: #f8d7da; color: #721c24; }
        .petunjuk { font-size: 0.9rem; color: #666; margin-bottom: 15px; line-height: 1.5; }
        .cek-semua { color: #e67e22; font-weight: bold; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Kuis Benar/Salah — Simpan ke Google Sheet</h1>
        
        <div id="layar-setup" class="layar aktif">
            <h2>➕ Buat Tim Baru</h2>
            <div class="buat-tim-baris">
                <input type="text" id="input-nama-tim" placeholder="Contoh: TIM A, TIM MERAH...">
                <button class="btn-buat-tim" onclick="buatTim()">Buat Tim</button>
            </div>
            
            <h2>👥 Daftar Tim & Anggota</h2>
            <div class="petunjuk">
                💡 Klik <strong>"+ Anggota"</strong> → ketik minimal 4 huruf nama → klik nama untuk tambahkan
            </div>
            <div class="daftar-tim" id="wadah-tim"></div>
            
            <button class="btn-mulai" id="btn-mulai" onclick="mulaiBermain()" disabled>▶️ Mulai Permainan</button>
        </div>
        
        <div id="layar-main" class="layar">
            <div class="progress" id="info-soal">Soal 1 dari 0</div>
            <div class="soal-box" id="teks-soal"></div>
            
            <div class="cek-semua" id="info-status-pilih">⏳ Menunggu semua tim memilih jawaban...</div>
            
            <div class="daftar-pilihan-tim" id="wadah-pilihan"></div>
            
            <button class="btn-periksa" id="btn-periksa" onclick="periksaSemuaJawaban()" disabled>✅ CEK SEMUA JAWABAN</button>
            
            <div class="kotak-umpan" id="kotak-umpan"></div>
            
            <button class="btn-lanjut" id="btn-lanjut" onclick="soalSelanjutnya()">Soal Berikutnya →</button>
        </div>
        
        <div id="layar-akhir" class="layar">
            <h2 style="text-align: center; font-size: 1.8rem;">🎉 Hasil Akhir — Poin Per Siswa</h2>
            <div id="status-simpan" class="status-simpan">📤 Menyimpan hasil ke Google Sheet...</div>
            <div class="peringkat" id="wadah-hasil"></div>
            <button class="btn-mulai" onclick="location.reload()">🔄 Mulai Baru</button>
        </div>
    </div>

<script>
// === KONFIGURASI ===
const SHEET_ID = "1FZ8Uj3l5IuCFchi-NnuCtjyrbTSN8sU8Nb6_EGLoIY0";
const URL_DATASISWA = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=datasiswa`;

// ⚠️ PENTING: Buat Apps Script Deployment di Google Sheet, ganti URL di bawah ini:
const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4Ee3PNxRqIt4wCtKL9wZvEVSzl7jcoJEfhG4_rhmYlhfVeFFT-2pE_UxeN9rK6djcCA/exec"; // Isi dengan URL Deployment Apps Script kamu

// === DATA ===
let daftarNama = [];
let daftarTim = [];
let timTerbuka = null;
let daftarSoal = [];
let nomorSoal = 0;
let sudahDiperiksa = false;

// === INISIALISASI ===
document.addEventListener("DOMContentLoaded", async () => {
    await muatNamaSiswa();
    await muatSoal();
    tampilDaftarTim();
});

// === AMBIL NAMA SISWA ===
async function muatNamaSiswa() {
    try {
        const res = await fetch(URL_DATASISWA);
        if (!res.ok) throw new Error("Gagal");
        const teks = await res.text();
        const data = JSON.parse(teks.substring(47, teks.length - 2));
        daftarNama = data.table.rows.map(r => r.c?.[0]?.v).filter(Boolean);
    } catch {
        daftarNama = [
            "BUDI SANTOSO", "SITI AISYAH", "AGUS PRATAMA", "DEWI KARTIKA",
            "JOKO SUSILO", "RINA ANGGRAENI", "ANDI PRATAMA", "LINA MAHARANI"
        ];
    }
}

// === BUAT TIM ===
function buatTim() {
    const input = document.getElementById("input-nama-tim");
    const nama = input.value.trim();
    if (!nama) return alert("Ketik nama tim dulu!");
    if (daftarTim.some(t => t.nama === nama)) return alert("Sudah ada tim ini!");
    
    daftarTim.push({ nama, anggota: [], jawaban: null });
    input.value = "";
    tampilDaftarTim();
}

// === TAMPIL DAFTAR TIM ===
function tampilDaftarTim() {
    const wadah = document.getElementById("wadah-tim");
    
    wadah.innerHTML = daftarTim.map((tim, idx) => {
        const buka = timTerbuka === idx;
        const daftarAnggota = tim.anggota.length === 0
            ? "<p style='color:#999; font-size:0.9rem;'>Belum ada anggota</p>"
            : tim.anggota.map((a, i) => `
                <div class="item-anggota">
                    <span>👤 ${a.nama}</span>
                    <span style="color:#2ecc71; font-weight:bold;">⭐ ${a.poin}</span>
                    <button class="btn-hapus-anggota" onclick="hapusAnggota(${idx}, ${i})">✕</button>
                </div>
            `).join("");
        
        return `
            <div class="tim-kartu ${buka ? 'terbuka' : ''}">
                <div class="tim-header">
                    <div>
                        <div class="tim-nama">${tim.nama}</div>
                        <div class="tim-meta">${tim.anggota.length} anggota</div>
                    </div>
                    <div style="display:flex; gap:4px;">
                        <button class="btn-tambah-buka" onclick="bukaTutupTambah(${idx})">
                            ${buka ? 'Tutup' : '+ Anggota'}
                        </button>
                        <button class="btn-hapus-tim" onclick="hapusTim(${idx})">Hapus</button>
                    </div>
                </div>
                <div class="area-tambah-anggota">
                    <div class="kotak-cari">
                        <input type="text" id="cari-${idx}" placeholder="Ketik 4+ huruf nama...">
                        <div class="daftar-saran" id="saran-${idx}"></div>
                    </div>
                    <div class="daftar-anggota">${daftarAnggota}</div>
                </div>
            </div>
        `;
    }).join("");
    
    daftarTim.forEach((_, idx) => {
        const input = document.getElementById(`cari-${idx}`);
        if (input) input.addEventListener("input", e => cariNama(e.target.value, idx));
    });
    
    document.getElementById("btn-mulai").disabled = daftarTim.length < 1;
}

function bukaTutupTambah(idx) {
    timTerbuka = timTerbuka === idx ? null : idx;
    tampilDaftarTim();
    if (timTerbuka === idx) setTimeout(() => document.getElementById(`cari-${idx}`)?.focus(), 100);
}

function cariNama(kata, idxTim) {
    const kotakSaran = document.getElementById(`saran-${idxTim}`);
    kata = kata.trim().toUpperCase();
    
    if (kata.length < 4) { kotakSaran.style.display = "none"; return; }
    
    const cocok = daftarNama.filter(n => n.toUpperCase().includes(kata)).slice(0, 6);
    
    if (cocok.length === 0) {
        kotakSaran.innerHTML = `<div class="item-saran">Tidak ditemukan</div>`;
    } else {
        kotakSaran.innerHTML = cocok.map(nama => {
            const sudah = daftarTim.some(t => t.anggota.some(a => a.nama === nama));
            return `<div class="item-saran ${sudah ? 'sudah-ada' : ''}" 
                        ${sudah ? '' : `onclick="tambahKeTim('${nama.replace(/'/g, "\\'")}', ${idxTim})"`}>
                        👤 ${nama} ${sudah ? '(sudah ada)' : ''}
                    </div>`;
        }).join("");
    }
    kotakSaran.style.display = "block";
}

function tambahKeTim(nama, idxTim) {
    if (daftarTim[idxTim].anggota.some(a => a.nama === nama)) return;
    daftarTim[idxTim].anggota.push({ nama, poin: 0 });
    
    const input = document.getElementById(`cari-${idxTim}`);
    if (input) input.value = "";
    const saran = document.getElementById(`saran-${idxTim}`);
    if (saran) saran.style.display = "none";
    
    tampilDaftarTim();
}

function hapusAnggota(idxTim, idxAnggota) {
    daftarTim[idxTim].anggota.splice(idxAnggota, 1);
    tampilDaftarTim();
}

function hapusTim(idx) {
    if (confirm("Yakin hapus tim ini?")) {
        daftarTim.splice(idx, 1);
        if (timTerbuka === idx) timTerbuka = null;
        tampilDaftarTim();
    }
}

// === MUAT SOAL ===
async function muatSoal() {
    try {
        const res = await fetch("soal.csv", { cache: "no-store" });
        if (!res.ok) throw new Error("Tidak ada soal.csv");
        const teks = await res.text();
        const baris = teks.split("\n").map(r => {
            let hasil = [], bagian = "", dalamKutip = false;
            for (let c of r) {
                if (c === '"') dalamKutip = !dalamKutip;
                else if (c === "," && !dalamKutip) { hasil.push(bagian.trim()); bagian = ""; }
                else bagian += c;
            }
            hasil.push(bagian.trim());
            return hasil;
        });
        daftarSoal = [];
        for (let i = 1; i < baris.length; i++) {
            const k = baris[i];
            if (!k || k.length < 2) continue;
            const teks = k[0].replace(/^"|"$/g, "");
            const jawab = String(k[1]).toUpperCase().replace(/^"|"$/g, "") === "BENAR";
            const jelas = k[2]?.replace(/^"|"$/g, "") || (jawab ? "✅ Benar!" : "❌ Salah!");
            if (teks) daftarSoal.push({ teks, jawaban: jawab, penjelasan: jelas });
        }
    } catch {
        daftarSoal = [
            { teks: "CPU adalah otak dari komputer", jawaban: true, penjelasan: "✅ BENAR: CPU memproses semua perintah dan data." },
            { teks: "RAM menyimpan data permanen meski dimatikan", jawaban: false, penjelasan: "❌ SALAH: Data di RAM hilang saat dimatikan." },
            { teks: "Algoritma adalah langkah logis menyelesaikan masalah", jawaban: true, penjelasan: "✅ BENAR: Itulah definisi dasar algoritma." }
        ];
    }
}

// === MULAI BERMAIN ===
function mulaiBermain() {
    document.getElementById("layar-setup").classList.remove("aktif");
    document.getElementById("layar-main").classList.add("aktif");
    nomorSoal = 0;
    tampilSoalSaatIni();
}

function tampilSoalSaatIni() {
    sudahDiperiksa = false;
    daftarTim.forEach(t => t.jawaban = null);
    
    document.getElementById("info-soal").textContent = `Soal ${nomorSoal+1} dari ${daftarSoal.length}`;
    document.getElementById("teks-soal").textContent = daftarSoal[nomorSoal].teks;
    document.getElementById("kotak-umpan").style.display = "none";
    document.getElementById("btn-lanjut").style.display = "none";
    document.getElementById("btn-periksa").style.display = "block";
    document.getElementById("btn-periksa").disabled = true;
    perbaruiStatusPilihan();
}

function pilihJawaban(idxTim, pilihan) {
    if (sudahDiperiksa) return;
    daftarTim[idxTim].jawaban = pilihan;
    perbaruiStatusPilihan();
}

function perbaruiStatusPilihan() {
    const semuaSudahPilih = daftarTim.every(t => t.jawaban !== null);
    
    document.getElementById("info-status-pilih").textContent = 
        semuaSudahPilih ? "✅ Semua tim sudah memilih — Siap periksa!" 
                        : `⏳ Menunggu tim memilih... (${daftarTim.filter(t => t.jawaban !== null).length}/${daftarTim.length})`;
    
    document.getElementById("btn-periksa").disabled = !semuaSudahPilih;
    
    document.getElementById("wadah-pilihan").innerHTML = daftarTim.map((tim, idx) => {
        const pilih = tim.jawaban;
        const kelasStatus = pilih !== null ? "sudah-pilih" : "";
        const kelasPeriksa = sudahDiperiksa 
            ? (pilih === daftarSoal[nomorSoal].jawaban ? "benar" : "salah") 
            : "";
        
        return `
            <div class="pilihan-tim-kartu ${kelasStatus} ${kelasPeriksa ? 'terperiksa ' + kelasPeriksa : ''}">
                <div class="baris-pilihan">
                    <span class="nama-tim-pilih">${tim.nama}</span>
                    <div class="tombol-pilih">
                        <button class="btn-pilih-jwb benar ${pilih === true ? 'dipilih' : ''}"
                                onclick="pilihJawaban(${idx}, true)" ${sudahDiperiksa ? 'disabled' : ''}>
                            ✅ BENAR
                        </button>
                        <button class="btn-pilih-jwb salah ${pilih === false ? 'dipilih' : ''}"
                                onclick="pilihJawaban(${idx}, false)" ${sudahDiperiksa ? 'disabled' : ''}>
                            ❌ SALAH
                        </button>
                    </div>
                </div>
                <div class="poin-anggota" style="margin-top: 8px;">
                    ${tim.anggota.map(a => `<span class="poin-siswa">${a.nama.split(' ')[0]}: ⭐ ${a.poin}</span>`).join("")}
                </div>
            </div>
        `;
    }).join("");
}

function periksaSemuaJawaban() {
    sudahDiperiksa = true;
    const soal = daftarSoal[nomorSoal];
    
    daftarTim.forEach(tim => {
        if (tim.jawaban === soal.jawaban) {
            tim.anggota.forEach(a => a.poin++);
        }
    });
    
    perbaruiStatusPilihan();
    
    const kotak = document.getElementById("kotak-umpan");
    const timBenar = daftarTim.filter(t => t.jawaban === soal.jawaban).map(t => t.nama).join(", ");
    const timSalah = daftarTim.filter(t => t.jawaban !== soal.jawaban).map(t => t.nama).join(", ");
    
    kotak.className = "kotak-umpan " + (soal.jawaban ? "benar" : "salah");
    kotak.innerHTML = `
        <strong>${soal.penjelasan}</strong><br>
        ✅ Tim Benar: ${timBenar || "Tidak ada"}<br>
        ❌ Tim Salah: ${timSalah || "Tidak ada"}<br>
        📝 Setiap anggota tim yang benar mendapat <strong>+1 poin</strong>
    `;
    kotak.style.display = "block";
    
    document.getElementById("btn-periksa").style.display = "none";
    
    if (nomorSoal < daftarSoal.length - 1) {
        document.getElementById("btn-lanjut").style.display = "block";
    } else {
        setTimeout(tampilHasil, 2000);
    }
}

function soalSelanjutnya() {
    nomorSoal++;
    tampilSoalSaatIni();
}

// === SIMPAN KE GOOGLE SHEET ===
async function simpanKeGoogleSheet(semuaSiswa) {
    if (!APPSCRIPT_URL) {
        document.getElementById("status-simpan").className = "status-simpan gagal";
        document.getElementById("status-simpan").textContent = "⚠️ URL Apps Script belum diisi — data tidak tersimpan";
        return false;
    }
    
    try {
        const res = await fetch(APPSCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ siswa: semuaSiswa, waktu: new Date().toLocaleString("id-ID") })
        });
        
        document.getElementById("status-simpan").className = "status-simpan berhasil";
        document.getElementById("status-simpan").textContent = "✅ Hasil berhasil disimpan ke Google Sheet!";
        return true;
    } catch (err) {
        document.getElementById("status-simpan").className = "status-simpan gagal";
        document.getElementById("status-simpan").textContent = "❌ Gagal menyimpan: " + err.message;
        return false;
    }
}

// === HASIL AKHIR ===
async function tampilHasil() {
    document.getElementById("layar-main").classList.remove("aktif");
    document.getElementById("layar-akhir").classList.add("aktif");
    
    const semuaSiswa = [];
    daftarTim.forEach(tim => {
        tim.anggota.forEach(a => {
            semuaSiswa.push({ nama: a.nama, poin: a.poin, tim: tim.nama });
        });
    });
    
    semuaSiswa.sort((a, b) => b.poin - a.poin);
    
    // Simpan ke Google Sheet
    await simpanKeGoogleSheet(semuaSiswa);
    
    document.getElementById("wadah-hasil").innerHTML = semuaSiswa.length === 0
        ? "<p style='text-align:center; color:#666;'>Belum ada data siswa</p>"
        : semuaSiswa.map((s, i) => {
            let kelas = "", medali = "";
            if (i===0) { kelas="p1"; medali="🥇"; }
            else if (i===1) { kelas="p2"; medali="🥈"; }
            else if (i===2) { kelas="p3"; medali="🥉"; }
            return `
                <div class="item-peringkat ${kelas}">
                    <div class="baris-atas">
                        <span>${medali || (i+1) + "."} ${s.nama}</span>
                        <span>⭐ ${s.poin} poin</span>
                    </div>
                    <div style="font-size:0.9rem; color:#555;">Tim: ${s.tim}</div>
                </div>
            `;
        }).join("");
}
</script>
