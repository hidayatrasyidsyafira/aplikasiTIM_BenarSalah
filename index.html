<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Benar/Salah — Mode Tim</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 25px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        h1 { color: #2c3e50; margin-bottom: 20px; font-size: 1.5rem; text-align: center; }
        h2 { font-size: 1.1rem; color: #34495e; margin: 15px 0 8px; }
        p { color: #555; line-height: 1.5; margin-bottom: 12px; }

        .tombol-pilih-peran { display: flex; gap: 12px; margin: 25px 0; }
        .btn-peran {
            flex: 1; padding: 25px 15px; border: 3px solid #ddd; border-radius: 16px;
            background: #fafafa; cursor: pointer; transition: all 0.25s;
            text-align: center; font-size: 1.1rem; font-weight: bold;
        }
        .btn-peran.terpilih { border-color: #4facfe; background: #eaf4fe; transform: scale(1.03); }
        .ikon { font-size: 2rem; margin-bottom: 8px; display: block; }

        input {
            width: 100%; padding: 14px 16px; font-size: 1rem;
            border: 2px solid #ddd; border-radius: 10px; outline: none; margin-bottom: 12px;
        }
        input:focus { border-color: #4facfe; }
        .btn {
            width: 100%; padding: 14px; font-size: 1rem; font-weight: bold;
            border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s;
            margin-top: 6px;
        }
        .btn-biru { background: #3498db; color: white; }
        .btn-biru:hover { background: #2980b9; }
        .btn-hijau { background: #2ecc71; color: white; }
        .btn-hijau:hover { background: #27ae60; }
        .btn-oranye { background: #f39c12; color: white; }
        .btn-merah { background: #e74c3c; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .kode-ruang-kotak {
            background: #eaf4fe; padding: 20px; border-radius: 14px; text-align: center;
            margin: 15px 0;
        }
        .kode-ruang { font-size: 2.5rem; font-weight: bold; color: #2980b9; letter-spacing: 6px; margin: 10px 0; }
        .sub-kode { font-size: 0.9rem; color: #666; }

        .layar { display: none; }
        .layar.aktif { display: block; }

        .kartu-tim {
            padding: 16px; border: 2px solid #ddd; border-radius: 12px;
            margin-bottom: 12px; cursor: pointer; transition: all 0.2s;
        }
        .kartu-tim:hover { border-color: #2ecc71; background: #f0fff4; }
        .kartu-tim.terpilih { border-color: #2ecc71; background: #d4edda; }
        .nama-tim { font-weight: bold; font-size: 1.1rem; }
        .jumlah-anggota { font-size: 0.9rem; color: #666; margin-top: 6px; }
        .daftar-anggota { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .baju-nama { background: #eaf4fe; padding: 5px 12px; border-radius: 15px; font-size: 0.9rem; }
        .baju-nama.saya { background: #2ecc71; color: white; font-weight: bold; }

        .soal-box {
            background: #f8f9fa; padding: 25px; border-radius: 16px;
            margin-bottom: 20px; border-left: 5px solid #4facfe;
            font-size: 1.2rem; line-height: 1.6; color: #2c3e50; text-align: center;
        }
        .info-atas { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; color: #666; }
        .timer { font-weight: bold; color: #e67e22; font-size: 1.1rem; }

        .tombol-jwb-besar { display: flex; gap: 15px; margin-top: 30px; }
        .btn-jwb {
            flex: 1; padding: 40px 20px; font-size: 1.5rem; font-weight: bold;
            border: none; border-radius: 16px; cursor: pointer; transition: all 0.2s;
        }
        .btn-jwb:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-benar { background: #2ecc71; color: white; }
        .btn-salah { background: #e74c3c; color: white; }
        .btn-jwb.dipilih { box-shadow: inset 0 0 0 4px gold; }

        .peringkat { margin-top: 20px; }
        .item-p {
            padding: 14px 16px; border-radius: 10px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .p1 { background: #fff3cd; border-left: 4px solid #f1c40f; }
        .p2 { background: #e9e9e9; border-left: 4px solid #95a5a6; }
        .p3 { background: #f5e6d3; border-left: 4px solid #cd7f32; }
        .medali { font-size: 1.2rem; margin-right: 8px; }
        .hanya-guru { display: none; }
        .guru-lihat { display: block; }
        .siswa-sembunyi { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Kuis Benar / Salah — Mode Tim</h1>

        <!-- === LAYAR PILIH PERAN === -->
        <div id="layar-peran" class="layar aktif">
            <p style="text-align:center; margin-bottom:5px;">Pilih peran Anda:</p>
            <div class="tombol-pilih-peran">
                <button class="btn-peran" id="btn-peran-guru" onclick="pilihPeran('guru')">
                    <span class="ikon">👨‍🏫</span>
                    Guru
                </button>
                <button class="btn-peran" id="btn-peran-siswa" onclick="pilihPeran('siswa')">
                    <span class="ikon">👤</span>
                    Siswa
                </button>
            </div>
        </div>

        <!-- === LAYAR GURU: BUAT TIM & KODE === -->
        <div id="layar-guru" class="layar">
            <h2>📡 Buat Ruang & Tim</h2>
            
            <div style="display:flex; gap:8px; margin:15px 0;">
                <input type="text" id="input-nama-tim" placeholder="Nama Tim (contoh: TIM A)">
                <button class="btn btn-biru" style="width:auto; white-space:nowrap; flex-shrink:0;" onclick="tambahTim()">+ Tim</button>
            </div>
            
            <div id="daftar-tim-guru" style="margin:15px 0;"></div>

            <div class="kode-ruang-kotak" id="kotak-kode" style="display:none;">
                <p class="sub-kode">Bagikan kode ini ke siswa:</p>
                <div class="kode-ruang" id="tampil-kode"></div>
                <button class="btn btn-biru" style="width:auto; padding:8px 16px; font-size:0.9rem; margin-top:8px;" onclick="salinKode()">📋 Salin Kode</button>
            </div>

            <div id="status-siswa-masuk" style="margin:20px 0;"></div>

            <button class="btn btn-hijau" id="btn-mulai" onclick="mulaiKuis()" disabled>▶️ MULAI PERMAINAN</button>
        </div>

        <!-- === LAYAR SISWA: MASUK === -->
        <div id="layar-siswa-masuk" class="layar">
            <h2>🔑 Masuk ke Ruang</h2>
            <input type="text" id="kode-masuk" placeholder="Masukkan Kode Ruang" maxlength="6" style="text-align:center; font-size:1.3rem; letter-spacing:4px;">
            <input type="text" id="nama-saya" placeholder="Nama Lengkap Anda">
            <button class="btn btn-hijau" onclick="cekKode()">Lanjut →</button>
            <p id="pesan-salah" style="color:#e74c3c; margin-top:10px; display:none;">Kode tidak cocok! Coba lagi</p>
        </div>

        <!-- === LAYAR SISWA: PILIH TIM === -->
        <div id="layar-pilih-tim" class="layar">
            <h2>👥 Pilih Tim Anda</h2>
            <p style="color:#666; font-size:0.9rem;">Klik nama tim untuk bergabung</p>
            <div id="daftar-tim-siswa"></div>
        </div>

        <!-- === LAYAR TUNGGU === -->
        <div id="layar-tunggu" class="layar">
            <h2>⏳ Menunggu Mulai</h2>
            <div style="background:#fff3cd; padding:15px; border-radius:10px; margin:15px 0;">
                <p id="info-saya" style="margin:0;"></p>
            </div>
            <p style="text-align:center; color:#888; margin-top:30px;">Tunggu guru menekan tombol MULAI...</p>
        </div>

        <!-- === LAYAR BERMAIN === -->
        <div id="layar-bermain" class="layar">
            <div class="info-atas">
                <span id="nomor-soal"></span>
                <span class="timer" id="tampil-waktu"></span>
            </div>
            
            <div class="soal-box hanya-guru" id="teks-soal"></div>
            <p class="siswa-sembunyi" style="text-align:center; color:#666;">Lihat soal di layar/papan tulis</p>

            <div class="tombol-jwb-besar">
                <button class="btn-jwb btn-benar" id="jwb-benar" onclick="pilihJawab(true)">✅ BENAR</button>
                <button class="btn-jwb btn-salah" id="jwb-salah" onclick="pilihJawab(false)">❌ SALAH</button>
            </div>

            <div id="hasil-soal" style="margin-top:25px; display:none;"></div>
        </div>

        <!-- === LAYAR HASIL === -->
        <div id="layar-akhir" class="layar">
            <h2 style="text-align:center;">🎉 Hasil Akhir</h2>
            <div class="peringkat" id="daftar-hasil"></div>
            <button class="btn btn-biru" onclick="location.reload()" style="margin-top:20px;">🔄 Mulai Baru</button>
        </div>
    </div>

<script>
// === KONFIGURASI ===
const SHEET_ID = "1FZ8Uj3l5IuCFchi-NnuCtjyrbTSN8sU8Nb6_EGLoIY0";
const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4Ee3PNxRqIt4wCtKL9wZvEVSzl7jcoJEfhG4_rhmYlhfVeFFT-2pE_UxeN9rK6djcCA/exe"; // Tempel URL Apps Script kamu di sini
const WAKTU_PER_SOAL = 20; // detik

// === DATA GLOBAL ===
let peran = null; // 'guru' / 'siswa'
let kodeRuang = null;
let namaSiswa = null;
let timSaya = null; // indeks tim
let daftarTim = []; // {nama, anggota:[{nama, poin:0}], jawaban:null}
let daftarSoal = [];
let soalKe = 0;
let timer = null;
let sisaWaktu = 0;
let sudahJawab = false;

// === INISIALISASI ===
document.addEventListener("DOMContentLoaded", async () => {
    await muatSoalDariCSV();
    tampilLayar("peran");
});

// === PILIH PERAN ===
function pilihPeran(p) {
    peran = p;
    document.getElementById("btn-peran-guru").classList.toggle("terpilih", p==="guru");
    document.getElementById("btn-peran-siswa").classList.toggle("terpilih", p==="siswa");
    
    setTimeout(() => {
        if (p === "guru") {
            buatRuang();
            tampilLayar("guru");
        } else {
            tampilLayar("siswa-masuk");
        }
    }, 300);
}

// === GURU: BUAT RUANG ===
function buatRuang() {
    kodeRuang = Math.floor(100000 + Math.random() * 900000).toString();
    daftarTim = [];
    document.getElementById("kotak-kode").style.display = "block";
    document.getElementById("tampil-kode").textContent = kodeRuang;
}

function tambahTim() {
    const input = document.getElementById("input-nama-tim");
    const nama = input.value.trim();
    if (!nama) return alert("Ketik nama tim dulu!");
    if (daftarTim.some(t => t.nama === nama)) return alert("Tim sudah ada!");
    
    daftarTim.push({ nama, anggota: [], jawaban: null });
    input.value = "";
    tampilDaftarTimGuru();
}

function tampilDaftarTimGuru() {
    const wadah = document.getElementById("daftar-tim-guru");
    wadah.innerHTML = daftarTim.map((tim, i) => `
        <div class="kartu-tim">
            <div class="nama-tim">${tim.nama}</div>
            <div class="jumlah-anggota">${tim.anggota.length} anggota bergabung</div>
            <div class="daftar-anggota">
                ${tim.anggota.length === 0 
                    ? '<span style="color:#999; font-size:0.85rem;">Belum ada siswa</span>' 
                    : tim.anggota.map(a => `<span class="baju-nama">${a.nama}</span>`).join("")}
            </div>
        </div>
    `).join("");
    
    // Simpan daftarTim ke localStorage agar bisa dibaca siswa di HP yang sama
    // Untuk versi produksi pakai Firebase/server
    simpanDataTimKePenyimpanan();
    
    // Cek apakah sudah bisa mulai
    const adaAnggota = daftarTim.some(t => t.anggota.length > 0);
    document.getElementById("btn-mulai").disabled = !adaAnggota;
    
    // Tampil status
    const total = daftarTim.reduce((s,t) => s + t.anggota.length, 0);
    document.getElementById("status-siswa-masuk").innerHTML = 
        `<p>✅ Total <strong>${total}</strong> siswa sudah bergabung</p>`;
}

function simpanDataTimKePenyimpanan() {
    // Simpan agar bisa dibaca di tab yang sama/domain yang sama
    localStorage.setItem('daftarTim', JSON.stringify(daftarTim));
    localStorage.setItem('kodeRuang', kodeRuang);
}

function salinKode() {
    navigator.clipboard.writeText(kodeRuang)
        .then(() => alert("Kode disalin! Kirim ke siswa ya"));
}

// === SISWA: MASUK & PILIH TIM ===
function cekKode() {
    const kode = document.getElementById("kode-masuk").value.trim();
    namaSiswa = document.getElementById("nama-saya").value.trim();
    
    if (!kode || !namaSiswa) return alert("Isi kode dan nama dulu!");
    
    // Baca daftar tim dari penyimpanan (untuk demo di perangkat yang sama)
    const kodeTersimpan = localStorage.getItem('kodeRuang');
    const timTersimpan = JSON.parse(localStorage.getItem('daftarTim') || '[]');
    
    if (kodeTersimpan === kode && timTersimpan.length > 0) {
        kodeRuang = kode;
        daftarTim = timTersimpan;
        tampilLayar("pilih-tim");
        tampilDaftarTimSiswa();
    } else {
        document.getElementById("pesan-salah").style.display = "block";
    }
}

function tampilDaftarTimSiswa() {
    const wadah = document.getElementById("daftar-tim-siswa");
    wadah.innerHTML = daftarTim.map((tim, i) => {
        const sudahGabung = tim.anggota.some(a => a.nama === namaSiswa);
        return `
            <div class="kartu-tim ${sudahGabung ? 'terpilih' : ''}" 
                 onclick="pilihGabung(${i})">
                <div class="nama-tim">${sudahGabung ? '✅ ' : ''}${tim.nama}</div>
                <div class="jumlah-anggota">${tim.anggota.length} anggota</div>
                <div class="daftar-anggota">
                    ${tim.anggota.map(a => `<span class="baju-nama ${a.nama===namaSiswa?'saya':''}">${a.nama}</span>`).join("")}
                </div>
            </div>
        `;
    }).join("");
}

function pilihGabung(idx) {
    // Cek sudah masuk tim ini?
    if (daftarTim[idx].anggota.some(a => a.nama === namaSiswa)) {
        timSaya = idx;
        tampilLayarTunggu();
        return;
    }
    
    // Cek nama sudah dipakai di tim lain?
    const namaSudahAda = daftarTim.some(t => t.anggota.some(a => a.nama === namaSiswa));
    if (namaSudahAda) return alert("Nama ini sudah masuk tim lain!");
    
    // Tambahkan ke tim
    daftarTim[idx].anggota.push({ nama: namaSiswa, poin: 0 });
    timSaya = idx;
    
    // Simpan kembali
    localStorage.setItem('daftarTim', JSON.stringify(daftarTim));
    
    tampilLayarTunggu();
}

function tampilLayarTunggu() {
    tampilLayar("tunggu");
    document.getElementById("info-saya").innerHTML = 
        `✅ <strong>${namaSiswa}</strong> — Bergabung di <strong>${daftarTim[timSaya].nama}</strong>`;
}

// === MULAI PERMAINAN ===
function mulaiKuis() {
    if (daftarSoal.length === 0) return alert("Belum ada soal!");
    
    // Perbarui data sebelum mulai
    const timTersimpan = JSON.parse(localStorage.getItem('daftarTim') || '[]');
    if (timTersimpan.length > 0) daftarTim = timTersimpan;
    
    soalKe = 0;
    tampilLayarSemua("bermain");
    tampilSoal();
}

function tampilSoal() {
    sudahJawab = false;
    
    // Reset jawaban semua tim
    daftarTim.forEach(t => t.jawaban = null);
    
    // Tampil soal
    document.getElementById("nomor-soal").textContent = `Soal ${soalKe+1}/${daftarSoal.length}`;
    document.getElementById("teks-soal").textContent = daftarSoal[soalKe].teks;
    document.getElementById("hasil-soal").style.display = "none";
    
    // Aktifkan tombol
    document.getElementById("jwb-benar").disabled = false;
    document.getElementById("jwb-salah").disabled = false;
    document.getElementById("jwb-benar").classList.remove("dipilih");
    document.getElementById("jwb-salah").classList.remove("dipilih");
    
    // Mulai hitung waktu
    sisaWaktu = WAKTU_PER_SOAL;
    document.getElementById("tampil-waktu").textContent = sisaWaktu + "s";
    if (timer) clearInterval(timer);
    timer = setInterval(() => {
        sisaWaktu--;
        document.getElementById("tampil-waktu").textContent = sisaWaktu + "s";
        if (sisaWaktu <= 0) {
            clearInterval(timer);
            waktuHabis();
        }
    }, 1000);
}

// === PILIH JAWABAN ===
function pilihJawab(pilihan) {
    if (sudahJawab) return;
    sudahJawab = true;
    
    // Tandai pilihan
    document.getElementById("jwb-benar").disabled = true;
    document.getElementById("jwb-salah").disabled = true;
    document.getElementById("jwb-benar").classList.toggle("dipilih", pilihan === true);
    document.getElementById("jwb-salah").classList.toggle("dipilih", pilihan === false);
    
    // Simpan jawaban tim
    if (timSaya !== null) {
        daftarTim[timSaya].jawaban = pilihan;
        localStorage.setItem('daftarTim', JSON.stringify(daftarTim));
    }
}

// === WAKTU HABIS ===
function waktuHabis() {
    // Ambil data terbaru
    const timTerbaru = JSON.parse(localStorage.getItem('daftarTim') || '[]');
    if (timTerbaru.length > 0) daftarTim = timTerbaru;
    
    const soal = daftarSoal[soalKe];
    
    // Beri poin
    daftarTim.forEach(tim => {
        if (tim.jawaban === soal.jawaban) {
            tim.anggota.forEach(a => a.poin++);
        }
    });
    
    // Simpan poin
    localStorage.setItem('daftarTim', JSON.stringify(daftarTim));
    
    // Tampil hasil
    const jawabanSayaBenar = timSaya !== null && daftarTim[timSaya]?.jawaban === soal.jawaban;
    const kotak = document.getElementById("hasil-soal");
    kotak.style.display = "block";
    kotak.innerHTML = `
        <div style="padding:15px; border-radius:10px; background:${jawabanSayaBenar?'#d4edda':'#f8d7da'}; color:${jawabanSayaBenar?'#155724':'#721c24'};">
            ${jawabanSayaBenar ? '✅ BENAR!' : '❌ SALAH!'}<br>
            ${soal.penjelasan}
            ${timSaya !== null ? `<br>Poin Anda: ⭐ ${daftarTim[timSaya].anggota.find(a => a.nama === namaSiswa)?.poin || 0}` : ''}
        </div>
    `;
    
    // Lanjut soal berikutnya
    setTimeout(() => {
        soalKe++;
        if (soalKe < daftarSoal.length) {
            tampilSoal();
        } else {
            selesai();
        }
    }, 3000);
}

// === SELESAI ===
function selesai() {
    if (timer) clearInterval(timer);
    tampilLayar("akhir");
    
    // Kumpulkan semua siswa
    const semuaSiswa = [];
    daftarTim.forEach(tim => {
        tim.anggota.forEach(a => {
            semuaSiswa.push({ nama: a.nama, poin: a.poin, tim: tim.nama });
        });
    });
    
    // Urutkan
    semuaSiswa.sort((a, b) => b.poin - a.poin);
    
    // Tampil
    document.getElementById("daftar-hasil").innerHTML = semuaSiswa.length === 0
        ? "<p style='text-align:center; color:#666;'>Belum ada data</p>"
        : semuaSiswa.map((s, i) => {
            let kelas = "", medali = "";
            if (i===0) { kelas="p1"; medali="🥇"; }
            else if (i===1) { kelas="p2"; medali="🥈"; }
            else if (i===2) { kelas="p3"; medali="🥉"; }
            return `
                <div class="item-p ${kelas}">
                    <div><span class="medali">${medali || (i+1)+'.'}</span> ${s.nama}</div>
                    <div><strong>⭐ ${s.poin}</strong> poin</div>
                </div>
            `;
        }).join("");
    
    // Simpan ke Google Sheet
    simpanKeSheet(semuaSiswa);
}

// === FUNGSI BANTU ===
function tampilLayar(nama) {
    document.querySelectorAll(".layar").forEach(l => l.classList.remove("aktif"));
    document.getElementById(`layar-${nama}`).classList.add("aktif");
    
    // Sesuaikan tampilan peran
    if (peran === "siswa") {
        document.querySelectorAll(".hanya-guru").forEach(el => el.style.display = "none");
        document.querySelectorAll(".siswa-sembunyi").forEach(el => el.style.display = "block");
    } else {
        document.querySelectorAll(".hanya-guru").forEach(el => el.style.display = "block");
        document.querySelectorAll(".siswa-sembunyi").forEach(el => el.style.display = "none");
    }
}

function tampilLayarSemua(nama) {
    tampilLayar(nama);
}

async function muatSoalDariCSV() {
    try {
        const res = await fetch("soal.csv", { cache: "no-store" });
        if (!res.ok) throw new Error("Tidak ada soal.csv");
        const teks = await res.text();
        const baris = teks.split("\n").map(r => {
            let hasil = [], bagian = "", dalamKutip = false;
            for (let c of r) {
                if (c === '"') dalamKutip = !dalamKutip;
                else if (c === "," && !dalamKutip) { hasil.push(bagian.trim()); bagian = ""; }
                else bagian += c;
            }
            hasil.push(bagian.trim());
            return hasil;
        });
        daftarSoal = [];
        for (let i = 1; i < baris.length; i++) {
            const k = baris[i];
            if (!k || k.length < 2) continue;
            const teks = k[0].replace(/^"|"$/g, "");
            const jawab = String(k[1]).toUpperCase().replace(/^"|"$/g, "") === "BENAR";
            const jelas = k[2]?.replace(/^"|"$/g, "") || (jawab ? "✅ Benar!" : "❌ Salah!");
            if (teks) daftarSoal.push({ teks, jawaban: jawab, penjelasan: jelas });
        }
    } catch {
        daftarSoal = [
            { teks: "CPU adalah otak dari komputer", jawaban: true, penjelasan: "✅ BENAR: CPU memproses semua perintah dan data." },
            { teks: "RAM menyimpan data permanen meski dimatikan", jawaban: false, penjelasan: "❌ SALAH: Data di RAM hilang saat dimatikan." },
            { teks: "Algoritma adalah langkah logis menyelesaikan masalah", jawaban: true, penjelasan: "✅ BENAR: Itulah definisi dasar algoritma." }
        ];
    }
}

async function simpanKeSheet(data) {
    if (!APPSCRIPT_URL) return;
    try {
        await fetch(APPSCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ siswa: data, waktu: new Date().toLocaleString("id-ID") })
        });
    } catch {}
}
